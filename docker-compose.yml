version: "3.9"

services:
  api:
    build: .
    container_name: devops-api
    ports:
      - "4000:4000"
    env_file:
      - src/config/.env
    depends_on:
      - mongo
    networks:
      - devops-net

  mongo:
    image: mongo:6
    container_name: devops-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - devops-net

networks:
  devops-net:

volumes:
  mongo_data:
